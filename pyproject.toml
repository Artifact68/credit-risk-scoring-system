[project]
name = "credit-risk-scoring-system"
version = "0.1.0"
description = "End-to-end credit risk scoring service"
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
